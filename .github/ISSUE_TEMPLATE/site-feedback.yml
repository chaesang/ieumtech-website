name: Site feedback or bug
description: Something on ieumtech.net looks wrong, broke, or could be better.
labels: ["status:triage"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Bug — something is broken
        - Feedback — something could be better
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or URL
      placeholder: https://ieumtech.net/...
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: What's going on
      description: What you saw, and what you expected.
    validations:
      required: true
