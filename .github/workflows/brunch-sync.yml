name: Sync Brunch articles

on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 KST daily
  workflow_dispatch:

concurrency:
  group: brunch-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Sync new Brunch articles
        run: npx tsx scripts/migrate-brunch.ts --auto

      - name: Commit and push if changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "brunch-sync[bot]"
            git config user.email "brunch-sync[bot]@users.noreply.github.com"
            git add -A src/content/writing/ko public/writing
            git commit -m "chore(brunch): auto-sync new articles ($(date -u +%Y-%m-%d))" \
              -m "via .github/workflows/brunch-sync.yml"
            git push
          else
            echo "No new articles."
          fi
